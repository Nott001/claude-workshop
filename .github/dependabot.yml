version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Patch and minor bumps arrive as one PR per group so review stays cheap.
    # Majors stay separate: they need a human to read the changelog.
    groups:
      production-patches:
        dependency-type: production
        update-types: [patch, minor]
      development:
        dependency-type: development
        update-types: [patch, minor]
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore"
