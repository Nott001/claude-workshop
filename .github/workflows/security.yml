name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly-disclosed advisories against unchanged code still surface.
    - cron: "0 3 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# pull-requests: read is needed by two jobs that ask GitHub about the PR itself
# rather than about the code: gitleaks lists the PR's commits to scan them, and
# paths-filter lists its changed files. With contents: read alone both got a 403
# ("Resource not accessible by integration"), and the three jobs gated on
# paths-filter were skipped in turn — so the whole workflow reported without
# inspecting anything. Read-only; nothing here writes to a pull request.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Filtering happens per job rather than on the workflow, because `Security` is
  # meant to be a required status check. A workflow skipped by `paths-ignore`
  # never reports, leaving a required check pending and the PR unmergeable —
  # so the workflow always runs and the aggregator always reports, while the
  # individual jobs decide whether they have anything to do.
  #
  # Outside pull requests (push to main, weekly cron) nothing is filtered.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'next.config.ts'
              - 'tsconfig.json'
            deps:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            migrations:
              - 'supabase/migrations/**'

  # Static analysis for injection, auth bypass, unsafe redirects and the like.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    # A job-level block replaces the workflow-level one rather than merging with
    # it, so this job never saw the pull-requests: read added there — and it does
    # not need it. It does need actions: read, which GitHub documents as required
    # for CodeQL on a private repository: the action calls the workflow-runs API
    # after analysis and was failing with "Resource not accessible by integration"
    # on /actions/runs/{id}. Analysis itself was fine; it got as far as
    # "Interpreting code scanning results for javascript" before dying.
    #
    # This is not expected to make the job pass on its own. Uploading results
    # needs code scanning enabled, which on a private repo requires GitHub
    # Advanced Security. It removes one real blocker and makes the remaining
    # failure state the plain one, instead of two tangled errors.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript
          # security-extended adds lower-severity and experimental queries; this
          # codebase handles payments, QR tickets and role-gated routes, so the
          # extra signal is worth the longer run.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4.37.3
        with:
          category: /language:javascript-typescript

  # Production dependencies are gated hard. Dev-only advisories are reported but
  # do not block: they never reach a user, and blocking on them trains people to
  # merge red. The current 3 high findings are all dev-only (eslint > minimatch).
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # The dependency tree only changes when the manifest or lockfile does. The
    # weekly cron still audits an unchanged tree against new advisories.
    if: github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Audit dev dependencies (advisory)
        if: always()
        continue-on-error: true
        run: pnpm audit --dev --audit-level=high

  # Catches credentials committed by mistake. This repo gitignores .env* and a
  # local .env.local holds live Supabase and payment-gateway keys, so a stray
  # `git add -f` is a realistic path to leaking them.
  # Deliberately unfiltered. Documentation is one of the likeliest places to
  # leak a credential — a key pasted into a README example, a token in a setup
  # guide — so a markdown-only change is exactly when this needs to run.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers secrets introduced in earlier
          # commits on the branch, not just the tip.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # Guards the database's own authorization layer. RLS is what stops one
  # attendee reading another's tickets or payments, and a migration that adds a
  # table without enabling it is a silent, total bypass of that guarantee.
  rls-policy:
    name: RLS policy check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.migrations == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Every table must enable row level security
        run: |
          missing=0
          for file in supabase/migrations/*.sql; do
            [ -e "$file" ] || continue
            tables=$(grep -oiP 'CREATE TABLE (IF NOT EXISTS )?"?\K[A-Za-z_][A-Za-z0-9_]*' "$file" | sort -u)
            for t in $tables; do
              if ! grep -qiE "ALTER TABLE \"?${t}\"? ENABLE ROW LEVEL SECURITY" "$file"; then
                echo "::error file=${file}::Table '${t}' is created without ENABLE ROW LEVEL SECURITY."
                missing=1
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "Tables must enable RLS in the same migration that creates them."
            exit 1
          fi
          echo "All tables enable row level security."

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [changes, codeql, dependencies, secrets, rls-policy]
    # Always runs, so the required status check always reports.
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Upstream results: $results"
          for r in $results; do
            # `skipped` means the job had nothing to inspect on this diff, which
            # is a pass. `failure` and `cancelled` are not.
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A required security check did not succeed."
              exit 1
            fi
          done
          echo "All security checks passed."
