name: E2E

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "specs/**"
      - "LICENSE"
      - ".gitignore"
      - ".prettierignore"
  # `development` too, for the same reason as main: a pull request exercises the
  # branch being merged, not the merge result. The concurrency rule below
  # already treats this correctly — it only cancels pull_request runs, so a
  # development run is never killed mid-flight with its fixtures half torn down.
  push:
    branches: [main, development]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request run is free — the newer commit is what matters.
  # Superseding a run on main is not: it is the only verification that merge
  # gets, and killing it mid-flight also strands the `e2e-` rows and storage
  # objects the fixtures were about to tear down.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets are not exposed to pull requests from forks, and these tests
    # cannot run without them. Skipping is honest; failing would not be.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    # The Supabase config lives on the `development` environment, so a job only
    # sees it if it names the environment. Without this everything below
    # resolves to empty and the credential check fails the run.
    environment: development
    env:
      # Deliberately not the NEXT_PUBLIC_APP_URL environment variable. That one
      # is an ngrok tunnel for local webhook testing; these tests drive a server
      # on this runner, and payment-gateway.ts builds its redirect URLs from
      # this value, so pointing it off-box would break the ticket specs.
      NEXT_PUBLIC_APP_URL: http://localhost:3200
      # The project URL is public config, not a credential — it is an
      # environment *variable*, so it reads from `vars`, not `secrets`.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Fail early if credentials are missing
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::E2E needs, on the 'development' environment:"
            echo "::error::  secrets   - NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY"
            echo "::error::  variables - NEXT_PUBLIC_SUPABASE_URL"
            echo "::error::A name stored as a variable is not readable through 'secrets', or vice versa."
            exit 1
          fi

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # System libraries are not part of the cached browser directory, so they
      # are installed even on a cache hit.
      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm build

      - run: pnpm test:e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Must track `reporter`'s outputFolder in playwright.config.ts. The
          # default `playwright-report/` was never written there, so a failing
          # run uploaded nothing. The HTML reporter copies traces and
          # screenshots in, so this one directory is the whole report.
          path: test/e2e/.report/
          retention-days: 7
