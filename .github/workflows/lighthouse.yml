name: Lighthouse

on:
  pull_request:
    # Nothing here can change what a browser renders, so auditing it is waste.
    #
    # Lighthouse must NOT be added to branch protection as a required check
    # while this filter exists. A required check that never runs leaves the PR
    # permanently "waiting for status" and unmergeable.
    paths-ignore:
      - "**/*.md"
      - "specs/**"
      - "LICENSE"
      - ".gitignore"
      - ".prettierignore"
  # Also on main and development, because a pull request is audited against its
  # own branch. Two changes that each pass alone can combine into a regression
  # the merge result is the first thing to contain — which is exactly how a
  # 0.142 CLS reached development: pinning the footer in the app shell passed
  # its own audit, and only collided with client-loaded pages once merged.
  push:
    branches: [main, development]

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Supabase config lives on the `development` environment, so a job only
    # sees it if it names the environment. Without this everything below
    # resolves to empty and every fallback silently wins.
    environment: development
    env:
      # Lighthouse audits the production build, so the app needs the same build
      # inputs as the CI build job. The anon key is a public client credential.
      # Not the NEXT_PUBLIC_APP_URL environment variable: that is an ngrok
      # tunnel, and the audit runs against a server on this runner.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # The project URL is public config, not a credential — it is an
      # environment *variable*, so it reads from `vars`, not `secrets`.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      # `/` renders on demand and builds a service client to list upcoming
      # events. createClient throws on a missing key, so an unset value here is
      # a 500 on the very page being audited — the placeholder keeps the render
      # alive and the event list simply comes back empty.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # Same key as the CI build job, so whichever runs first warms the cache for
      # the other. Sharing a cache keeps the two workflows independent — passing
      # a build artifact between them would make this job wait on that one.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Build
        run: pnpm build

      # The action reads lighthouserc.json, which owns the URL list, the run
      # count and the assertions. It also starts the server itself via
      # startServerCommand, so no separate `pnpm start` step is needed.
      - name: Audit public routes
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
