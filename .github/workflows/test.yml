name: test
on:
  pull_request:
    types: [opened, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@0609f0983b7a228f052f81ef4c3d6510cae254ad
      with:
        version: 6.10.0
    - uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'pnpm'
    - run: pnpm install
    - run: pnpm format
    - run: pnpm lint
    - run: pnpm test
        
