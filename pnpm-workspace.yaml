allowBuilds:
  # Both are build tooling for the Cloudflare target: esbuild bundles the worker
  # and workerd is the runtime `wrangler dev` boots. Their install scripts only
  # fetch the platform binary, and neither can run without one.
  esbuild: true
  sharp: true
  unrs-resolver: false
  workerd: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Transitive advisories that reach production through `next`. Drop an entry once
# next itself resolves above the patched version.
overrides:
  postcss@<8.5.18: ">=8.5.18"
  sharp@<0.35.0: ">=0.35.0"

# Supply-chain controls. These lived in .npmrc, then .pnpmrc; pnpm 11 reads them
# from neither — `pnpm config get minimumReleaseAge` returned undefined in both
# cases, so they had never taken effect. This file is where pnpm actually looks.
#
# Reject dependency versions published within this window. Freshly-published
# versions are how compromised-maintainer attacks land; a delay lets advisories
# surface before the version can enter our lockfile.
minimumReleaseAge: 1440

# Lockfile is the source of truth. CI additionally passes --frozen-lockfile.
resolutionMode: highest
